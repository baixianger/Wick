<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D2C09A"/>
      <stop offset="20%" stop-color="#FBF3E0"/>
      <stop offset="50%" stop-color="#FFFAF0"/>
      <stop offset="80%" stop-color="#F1E5C9"/>
      <stop offset="100%" stop-color="#C4B084"/>
    </linearGradient>
    <linearGradient id="waxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7E4"/>
      <stop offset="100%" stop-color="#EAD9B6"/>
    </linearGradient>
  </defs>
  <!-- candle body -->
  <path d="M 392 380 C 392 366 403 355 417 355 L 607 355 C 621 355 632 366 632 380
           L 632 706 L 392 706 Z" fill="url(#wax)"/>
  <!-- wax top rim -->
  <ellipse cx="512" cy="380" rx="120" ry="22" fill="url(#waxTop)"/>
  <!-- soft warm pooled wax from the flame at the top -->
  <ellipse cx="512" cy="379" rx="80" ry="14" fill="#FFE3A6" opacity="0.55"/>
  <!-- vertical highlight streak -->
  <rect x="438" y="392" width="22" height="300" rx="11" fill="#FFFFFF" opacity="0.30"/>
  <!-- wick -->
  <path d="M 512 360 L 512 392" stroke="#3A2A12" stroke-width="9" stroke-linecap="round"/>
</svg>
