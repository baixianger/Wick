name: Wick
options:
  bundleIdPrefix: me.impai.wick
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode "Update to Recommended Settings" baseline (matches Pendler).
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Real Apple Developer signing — inherited by every target. Same
    # team ID Pendler and pd3 use; without this Xcode falls back to
    # "Sign to Run Locally" which can't ship to TestFlight / App Store.
    DEVELOPMENT_TEAM: TN7ZDD72P2
    CODE_SIGN_STYLE: Automatic
    # Versioning at project-base so future targets (widget / extension)
    # inherit the same Marketing + Current versions automatically.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Typed Swift accessors for asset-catalog colors/images:
    # `Image(.appIcon)` / `Color(.accent)` instead of stringly-typed.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # ─── Xcode 26 "Update to recommended settings" keys ─────────────
    # xcodegen regenerates the .pbxproj from this file, so changes the
    # user clicks through in Xcode's recommended-settings popup would
    # be wiped on the next `xcodegen generate`. Keys live here instead.
    #
    # Source of truth (re-verify after each Xcode release):
    #   /Applications/Xcode.app/Contents/Developer/Library/Xcode/Templates/
    #     Project Templates/Base/Base_ProjectSettings.xctemplate/TemplateInfo.plist
    #
    # The keys below are the delta between Xcode 26.5's template and
    # xcodegen 2.45.3's bundled `SettingPresets/base.yml` — xcodegen
    # covers the majority (every CLANG_WARN_* / GCC_WARN_* / MTL_*),
    # we patch what it doesn't.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GCC_WARN_SHADOW: YES
    # Bumped from xcodegen's stale defaults (gnu++14 / gnu11):
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: "gnu17"
    # Swift-target-level recommended keys. Xcode's template puts these
    # at SharedSettings of every Swift target; centralising at
    # project-base means new targets inherit automatically.
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

packages:
  CandleKit:
    url: https://github.com/baixianger/CandleKit.git
    from: 0.7.0
  TradingFloor:
    path: TradingFloor
  # MarkdownUI — block-level Markdown renderer (lists, headings,
  # tables, code blocks, blockquotes). Apple's
  # `AttributedString(markdown:)` is inline-only; we need real
  # block layout for the Wicker chat surface so agent transcripts
  # render as documents rather than walls of inline text.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: 2.4.1

targets:
  Wick:
    type: application
    platform: macOS
    sources:
      - path: Wick/App
      - path: Wick/Data
      - path: Wick/Design
      - path: Wick/Views
      - path: Wick/Resources
        excludes:
          - "Info.plist"
          - "Wick.entitlements"
    resources:
      - path: Wick/Resources/Assets.xcassets
      # Xcode 15 String Catalog. SwiftUI auto-extracts source strings
      # from `Text("...")` literals on every build (SWIFT_EMIT_LOC_STRINGS
      # is on at project base); the catalog ships zh-Hans translations
      # for the highest-visibility ones and stays a no-op for the rest.
      # Adding more languages = drop a new locale into the catalog;
      # no code changes needed.
      - path: Wick/Resources/Localizable.xcstrings
    dependencies:
      - package: CandleKit
        product: CoreCharts
      - package: CandleKit
        product: IndicatorKit
      - package: CandleKit
        product: DataAdapters
      - package: CandleKit
        product: DrawingTools
      - package: TradingFloor
        product: TradingFloor
      - package: MarkdownUI
        product: MarkdownUI
      # Bundles the wick-mcp helper into Wick.app/Contents/MacOS/. Users
      # point their Claude Code / Codex MCP config at the absolute path
      # `/Applications/Wick.app/Contents/MacOS/wick-mcp` — the helper
      # runs as its own process (Wick.app doesn't need to be open) and
      # shares state via the App Group container.
      - target: WickMCP
        copy:
          destination: executables
    settings:
      base:
        # NOTE: no `info:` block — xcodegen would auto-generate the
        # plist and strip hand-added keys (LSApplicationCategoryType,
        # ITSAppUsesNonExemptEncryption, …). We hand-manage
        # Info.plist; xcodegen only needs INFOPLIST_FILE + the
        # GENERATE_INFOPLIST_FILE=NO opt-out. Matches pd3's pattern.
        PRODUCT_BUNDLE_IDENTIFIER: me.impai.wick
        PRODUCT_NAME: Wick
        INFOPLIST_FILE: Wick/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No per-app accent override — inherit macOS system accent
        # (Graphite/Multicolor/Blue/etc.) so selections in the sidebar
        # and pickers match the user's system-wide preference. Rating
        # chips and other semantic colors are still set explicitly via
        # `ratingColor(_:)` and friends, not the accent.
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Wick/Resources/Wick.entitlements
        # SWIFT_APPROACHABLE_CONCURRENCY + SWIFT_UPCOMING_FEATURE_*
        # live at project-base (see top of file) — every target picks
        # them up automatically.

  # Stdio MCP server bundled inside Wick.app. Built as a sandboxed CLI
  # tool, copied into Wick.app/Contents/MacOS/wick-mcp by the Wick
  # target's copy-files phase (declared above). Shares state with the
  # main app via the `group.me.impai.wick` App Group.
  WickMCP:
    type: tool
    platform: macOS
    sources:
      - path: WickMCP/Sources/WickMCP
    dependencies:
      - package: TradingFloor
        product: TradingFloor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.impai.wick.mcp
        PRODUCT_NAME: wick-mcp
        CODE_SIGN_ENTITLEMENTS: WickMCP/wick-mcp.entitlements
        # CLI tools don't ship an Info.plist as a separate file; embed it
        # into the Mach-O `__TEXT,__info_plist` section instead. The
        # sandbox initializer needs the bundle ID to look up which
        # container to mount — without this, launch crashes in
        # `_libsecinit_appsandbox` with "invalid sandbox profile data".
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # The category key for embedded Info.plist; mirrors the main
        # app's category so the sandbox container is sibling, not nested.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        # Copyright stays in lockstep with Wick.app/Info.plist — App
        # Store convention is `YYYY name` (no ©, no "All rights
        # reserved"). Pendler ships the same shape.
        INFOPLIST_KEY_NSHumanReadableCopyright: 2026 impai
        # SWIFT_APPROACHABLE_CONCURRENCY + SWIFT_UPCOMING_FEATURE_* are
        # inherited from project-base settings — no per-target copy.
