name: Wick
options:
  bundleIdPrefix: ai.omika.wick
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    # Swift 7 prep — warn on bare-protocol existentials.
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # Xcode "Update to Recommended Settings" baseline.
    DEAD_CODE_STRIPPING: YES
    # Typed Swift accessors for asset-catalog colors/images:
    # `Image(.appIcon)` / `Color(.accent)` instead of stringly-typed names.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  CandleKit:
    path: ../CandleKit
targets:
  Wick:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Wick/App
      - path: Wick/Data
      - path: Wick/Design
      - path: Wick/Views
      - path: Wick/Resources
        excludes:
          - "Info.plist"
          - "Wick.entitlements"
    resources:
      - path: Wick/Resources/Assets.xcassets
    dependencies:
      - package: CandleKit
        product: CoreCharts
      - package: CandleKit
        product: IndicatorKit
      - package: CandleKit
        product: DataAdapters
      - package: CandleKit
        product: DrawingTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.omika.wick
        PRODUCT_NAME: Wick
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Wick/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: Wick/Resources/Wick.entitlements
